[package]
name = "home-tracker"
version = "0.1.0"
edition = "2024"
default-run = "home-tracker"

[profile.release]
codegen-units = 1
opt-level = 3
lto = true

[dependencies]
anyhow = "1"
async-trait = "0.1"
axum = { version = "0.8", features = ["http2", "macros", "multipart"] }
base64 = "0.22"
chrono = { version = "0.4", features = ["serde", "clock"] }
clap = { version = "4", features = ["derive"] }
diesel = { version = "2.3", features = ["sqlite", "r2d2", "chrono", "returning_clauses_for_sqlite_3_35"] }
diesel_migrations = { version = "2", features = ["sqlite"] }
dotenvy = "0.15"
hex = "0.4"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
juniper = { version = "0.17", features = ["anyhow", "chrono", "uuid"] }
juniper_axum = "0.3"
libsqlite3-sys = { version = "0.35", features = ["bundled"] }
mime_guess = "2"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots", "json", "http2"] }
rust-embed = { version = "8", features = ["axum", "compression"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
socket2 = "0.6"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync", "net", "fs", "time"] }
tokio-util = { version = "0.7", features = ["io"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["limit", "compression-gzip", "compression-br", "compression-zstd", "compression-deflate"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v7", "serde"] }
webp = "0.3"
zip = { version = "8", default-features = false, features = ["deflate"] }

[target.'cfg(target_env = "musl")'.dependencies]
tikv-jemallocator = "0.6"

[dev-dependencies]
axum-test = "21"
